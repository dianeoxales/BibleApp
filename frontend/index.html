<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
  <title>Bible Verse App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Bible Verse App</h1>

  <button id="getVerseBtn">Get Random Verse</button>

  <div id="verseBox">
    <h3 id="reference"></h3>
    <p id="verseText"></p>
  </div>

  <div id="searchBox">
  <input
    type="text"
    id="verseInput"
    placeholder="e.g. John 3:16"
  />
  <button id="searchBtn">Search Verse</button>
</div>

<button id="saveBtn">❤️ Save to Favourites</button>

<h2>Saved Verses</h2>
<div id="favourites"></div>

  <script src="script.js"></script>
</body>
</head>
</html>
